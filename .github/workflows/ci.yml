name: AVCLPR CI

on:
  push:
    branches: [main, p0-production-hardening]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run build:v2
      - run: cd dashboard && npm install && npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m compileall services/ai-engine/app
