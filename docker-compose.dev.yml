services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: avclpr
      POSTGRES_USER: avclpr
      POSTGRES_PASSWORD: avclpr_dev_only
    ports:
      - "5432:5432"
    volumes:
      - avclpr_postgres_dev:/var/lib/postgresql/data

volumes:
  avclpr_postgres_dev:
